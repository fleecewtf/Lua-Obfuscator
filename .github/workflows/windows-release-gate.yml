name: Windows release gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install-and-repair:
    name: ${{ matrix.runner }} clean install and repair
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONNOUSERSITE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and fresh-extract the exact release ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'Lua-Obfuscator-v1.0.15.zip'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'Fleece Lua Obfuscator release'
          & .\scripts\Build-ReleaseZip.ps1 -OutputPath $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $releaseRoot
          "RELEASE_ROOT=$releaseRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify early failures and repair instructions before downloads
        shell: pwsh
        run: .\.github\scripts\Test-SetupPreflight.ps1 -ReleaseRoot $env:RELEASE_ROOT -AppName 'Lua Obfuscator'

      - name: Perform a clean private setup and app self-test through the confirmation prompt
        shell: cmd
        run: |
          cd /d "%RELEASE_ROOT%"
          echo Y| call Installer.bat --no-pause

      - name: Verify the repair path against the installed runtime
        shell: cmd
        run: |
          cd /d "%RELEASE_ROOT%"
          Installer.bat --yes --no-pause

      - name: Verify the repaired shortcut target and launch contract
        shell: pwsh
        run: .\.github\scripts\Test-Shortcut.ps1 -ReleaseRoot $env:RELEASE_ROOT -AppName 'Lua Obfuscator'

      - name: Obfuscate benign Lua and Luau fixtures through the released app
        shell: pwsh
        run: |
          & (Join-Path $env:RELEASE_ROOT '.runtime\python\python.exe') -I '.github\scripts\Test-RealObfuscation.py' $env:RELEASE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'The real Lua/Luau app workflow failed.' }

      - name: Upload diagnostics if a gate fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: setup-diagnostics-${{ matrix.runner }}-${{ github.run_id }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            ${{ runner.temp }}/Fleece Lua Obfuscator release/setup.log
            ${{ runner.temp }}/Fleece Lua Obfuscator release/.runtime/error.log
            ${{ runner.temp }}/Fleece Lua Obfuscator release/.runtime/logs/*.log
